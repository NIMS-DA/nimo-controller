# Server port
port: 8888

# Data directory for candidates.csv and results/ (default: ~/.nimo-controller)
# data_dir: "~/my-nimo-data"

# mcp_servers:
#   sdl: "http://127.0.0.1:8001/mcp"

# Agent mode: show a prompt box under the execution log (experimental)
enable_agent: true

# Agent settings are synchronized with the gear settings in the UI.
# provider: openai | anthropic | ollama
# OpenAI uses ChatGPT sign-in when connected, otherwise the OPENAI_API_KEY environment variable.
# Anthropic requires the ANTHROPIC_API_KEY environment variable.
# Set API-key environment variables before launching the app.
# base_url is the Ollama API URL.
# Sign-in credentials are stored securely; API keys are read from the environment.

agent:
  provider: openai
  model: gpt-6-astra
  thinking: medium
  auto_approve: true
  base_url: http://127.0.0.1:11434/v1
