[project]
name = "nimo-controller"
version = "0.0.1"
description = "NIMO Controller: MCP-based orchestrator for self-driving laboratories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Naruki Yoshikawa" },
]
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.135.2",
    "fastmcp[tasks]>=3.1.1",
    "nimo",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[openai]>=2.22",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
nimo-controller = "nimo_controller.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
nimo = { git = "https://github.com/n-yoshikawa/nimo", branch = "feature/minimization-plot" }
