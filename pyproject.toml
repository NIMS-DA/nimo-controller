[project]
name = "nimo-controller"
version = "0.0.1"
description = "NIMO Controller: MCP-based interface for self-driving laboratories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Naruki Yoshikawa" },
]
dependencies = [
    "fastapi>=0.135.2",
    "fastmcp[tasks]>=3.1.1",
    "nimo>=2.1.4",
    "openai>=1.0",
    "openai-agents>=0.13.2",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
nimo-controller = "nimo_controller.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
